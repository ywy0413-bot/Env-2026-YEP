<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>퀴즈 라이브</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ── 화면 1: 대기 (닉네임 입력) ── -->
<div id="screen-lobby" class="screen active">
  <div class="lobby-inner">
    <div class="logo-area">
      <div class="logo-icon">🎯</div>
      <h1 class="logo-text">퀴즈 라이브</h1>
      <p class="logo-sub">실시간 생존 퀴즈</p>
    </div>
    <div class="join-form">
      <input id="nickname-input" type="text" maxlength="12" placeholder="닉네임 입력 (최대 12자)" autocomplete="off" />
      <button id="join-btn" class="btn-primary">참가하기</button>
      <p id="join-error" class="error-msg"></p>
    </div>
    <div id="lobby-info" class="lobby-info hidden">
      <div class="lobby-badge">✅ 참가 완료</div>
      <div class="waiting-text">게임 시작을 기다리는 중...</div>
      <div id="player-count-display" class="player-count">0명 참가 중</div>
      <div class="heart-display">
        <span>보유 생명</span>
        <span id="my-hearts">❤️</span>
      </div>
    </div>
  </div>
</div>

<!-- ── 화면 2: 게임 카운트다운 ── -->
<div id="screen-countdown" class="screen">
  <div class="countdown-inner">
    <p class="countdown-label">게임 시작!</p>
    <div id="countdown-number" class="countdown-number">3</div>
    <p class="countdown-sub">준비하세요!</p>
  </div>
</div>

<!-- ── 화면 3: 문제 화면 ── -->
<div id="screen-question" class="screen">
  <div class="question-header">
    <div class="q-meta">
      <span id="q-index">1</span> / <span id="q-total">12</span>
      <span class="survivor-pill">생존 <span id="q-alive">0</span>명</span>
    </div>
    <div class="timer-wrap">
      <svg class="timer-svg" viewBox="0 0 80 80">
        <circle class="timer-bg" cx="40" cy="40" r="34"/>
        <circle id="timer-arc" class="timer-arc" cx="40" cy="40" r="34"/>
      </svg>
      <span id="timer-text" class="timer-text">15</span>
    </div>
    <div id="my-hearts-q" class="hearts-q">❤️</div>
  </div>

  <div class="question-body">
    <p id="question-text" class="question-text"></p>
  </div>

  <div id="choices-wrap" class="choices-wrap"></div>

  <div id="answered-overlay" class="answered-overlay hidden">
    <div class="answered-icon">✅</div>
    <div class="answered-text">답변 완료!</div>
    <div id="answered-label" class="answered-label"></div>
  </div>
</div>

<!-- ── 화면 4: 정답 공개 ── -->
<div id="screen-reveal" class="screen">
  <div class="reveal-inner">
    <div id="reveal-result-icon" class="reveal-icon">✅</div>
    <div id="reveal-result-text" class="reveal-result-text">정답!</div>
    <div id="reveal-correct" class="reveal-correct-box"></div>
    <div id="reveal-stats" class="reveal-stats"></div>
    <div id="reveal-heart-msg" class="reveal-heart-msg hidden"></div>
    <div class="reveal-next-hint">잠시 후 다음 문제...</div>
  </div>
</div>

<!-- ── 화면 5: 탈락 ── -->
<div id="screen-eliminated" class="screen">
  <div class="eliminated-inner">
    <div class="elim-icon">💔</div>
    <h2 class="elim-title">탈락!</h2>
    <p class="elim-msg">아쉽게도 생존자에서 제외되었습니다</p>
    <p class="elim-sub">끝까지 응원해주세요 🎉</p>
    <div id="eliminated-progress" class="elim-progress">
      <div class="ep-label">현재 문제</div>
      <div id="ep-bar-wrap" class="ep-bar-wrap">
        <div id="ep-bar" class="ep-bar"></div>
      </div>
    </div>
  </div>
</div>

<!-- ── 화면 6: 게임 종료 ── -->
<div id="screen-finished" class="screen">
  <div class="finished-inner">
    <div class="finish-title">🏆 최종 결과</div>
    <div id="finish-winners" class="finish-winners"></div>
    <div id="finish-my-result" class="finish-my-result"></div>
    <button id="finish-replay-btn" class="btn-secondary">다시 대기하기</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="game.js"></script>
</body>
</html>
